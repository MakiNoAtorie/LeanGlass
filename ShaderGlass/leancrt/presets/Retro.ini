; LeanGlass preset: Retro (16:9)
; Royale look with a visible low-res slot mask and 2px scanlines.
Techniques=LeanCRT@LeanCRT.fx
TechniqueSorting=LeanCRT@LeanCRT.fx

[LeanCRT.fx]
mask_type=4
scanline_thickness=2
phosphor_thickness=0.200000,0.200000
beam_shape_mode=1
enable_interlacing=0
geom_mode_runtime=0
PreprocessorDefinitions=ENABLE_PREBLUR=0
