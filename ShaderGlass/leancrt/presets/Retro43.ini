; LeanGlass preset: Retro 4:3
; Same look as Retro, with the CRT faceplate fitted to 4:3 content.
; The content box expression stays correct at any output resolution.
Techniques=LeanCRT@LeanCRT.fx
TechniqueSorting=LeanCRT@LeanCRT.fx

[LeanCRT.fx]
mask_type=4
scanline_thickness=2
phosphor_thickness=0.200000,0.200000
beam_shape_mode=1
enable_interlacing=0
geom_mode_runtime=0
PreprocessorDefinitions=ENABLE_PREBLUR=0,CONTENT_HEIGHT=BUFFER_HEIGHT,CONTENT_WIDTH=int(BUFFER_HEIGHT*4.0/3.0/2.0)*2
