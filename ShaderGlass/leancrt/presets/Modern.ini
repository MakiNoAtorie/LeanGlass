; LeanGlass preset: Modern (16:9)
; Softer mask and 1px scanlines so UI text stays legible at 1080p.
Techniques=LeanCRT@LeanCRT.fx
TechniqueSorting=LeanCRT@LeanCRT.fx

[LeanCRT.fx]
mask_type=4
scanline_thickness=1
phosphor_thickness=0.450000,0.450000
levels_contrast=0.900000
beam_shape_mode=1
enable_interlacing=0
geom_mode_runtime=0
PreprocessorDefinitions=ENABLE_PREBLUR=0
