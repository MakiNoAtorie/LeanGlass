name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:    
    - run: Get-PSDrive

    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} ShaderGlass.sln

    - name: Stage LeanGlass
      shell: pwsh
      run: |
        $stage = "stage"
        Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Copy-Item ".\${{ matrix.platform }}\${{ matrix.configuration }}\LeanGlass.exe" "$stage\LeanGlass.exe" -ErrorAction Stop
        Copy-Item ".\${{ matrix.platform }}\${{ matrix.configuration }}\leancrt" "$stage\leancrt" -Recurse -Force
        Copy-Item ".\ShaderGlass\leancrt\ReShade.ini" "$stage\ReShade.ini" -Force
        Copy-Item ".\LICENSE" "$stage\ShaderGlass-LICENSE.txt" -Force
        if (Test-Path ".\README-LEANGLASS.txt") { Copy-Item ".\README-LEANGLASS.txt" "$stage\README-LEANGLASS.txt" -Force }

        Invoke-WebRequest -Uri "https://reshade.me/downloads/ReShade_Setup_6.6.2.exe" -OutFile "reshade-setup.exe"
        & ".\tools\extract-reshade.ps1" -Setup ".\reshade-setup.exe" -OutFile "$stage\dxgi.dll"

        Compress-Archive -Path "$stage\*" -DestinationPath "LeanGlass-x64.zip" -Force

        $nativeStage = "stage-native"
        Remove-Item -Recurse -Force $nativeStage -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $nativeStage | Out-Null
        Copy-Item ".\${{ matrix.platform }}\${{ matrix.configuration }}\LeanGlass.exe" "$nativeStage\LeanGlass.exe" -Force
        New-Item -ItemType Directory -Force -Path "$nativeStage\native" | Out-Null
        Copy-Item ".\${{ matrix.platform }}\${{ matrix.configuration }}\native\LeanCRT.hlsl" "$nativeStage\native\LeanCRT.hlsl" -Force
        Copy-Item ".\LICENSE" "$nativeStage\ShaderGlass-LICENSE.txt" -Force
        Copy-Item ".\ShaderGlass\leancrt\LeanCRT-LICENSE.txt" "$nativeStage\LeanCRT-LICENSE.txt" -Force
        Copy-Item ".\README-NATIVE.txt" "$nativeStage\README-NATIVE.txt" -Force
        Compress-Archive -Path "$nativeStage\*" -DestinationPath "LeanGlass-native-x64.zip" -Force

        $expectedNative = @(
          'LeanGlass.exe',
          'native\LeanCRT.hlsl',
          'ShaderGlass-LICENSE.txt',
          'LeanCRT-LICENSE.txt',
          'README-NATIVE.txt'
        ) | Sort-Object
        $root = (Resolve-Path $nativeStage).Path
        $actualNative = Get-ChildItem $nativeStage -Recurse -File | ForEach-Object {
          $_.FullName.Substring($root.Length + 1)
        } | Sort-Object
        $diff = Compare-Object $expectedNative $actualNative
        if($diff) { throw "Native package contents changed: $($diff | Out-String)" }
        if((Get-Item "$nativeStage\native\LeanCRT.hlsl").Length -lt 100000) { throw "Native HLSL is suspiciously small" }
        $bad = Get-ChildItem $nativeStage -Recurse | Where-Object {
          $_.Name -match '^(dxgi\.dll|ReShade\.ini)$' -or $_.FullName -match '\\leancrt\\'
        }
        if($bad) { throw "Native package contains ReShade files: $($bad | Out-String)" }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'LeanGlass_${{ matrix.platform }}_${{ matrix.configuration }}'
        path: |
          LeanGlass-x64.zip
          LeanGlass-native-x64.zip
        if-no-files-found: error
        overwrite: true
