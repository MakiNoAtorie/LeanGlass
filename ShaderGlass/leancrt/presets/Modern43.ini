; LeanGlass preset: Modern 4:3
; Softer mask for 4:3 content, fitted faceplate at any output resolution.
Techniques=LeanCRT@LeanCRT.fx
TechniqueSorting=LeanCRT@LeanCRT.fx

[LeanCRT.fx]
mask_type=4
scanline_thickness=1
phosphor_thickness=0.450000,0.450000
levels_contrast=0.900000
beam_shape_mode=1
enable_interlacing=0
geom_mode_runtime=0
PreprocessorDefinitions=ENABLE_PREBLUR=0,CONTENT_HEIGHT=BUFFER_HEIGHT,CONTENT_WIDTH=int(BUFFER_HEIGHT*4.0/3.0/2.0)*2
